name: Docusaurus site to GitHub Pages

on:
  push:
    branches: [main]
  # schedule:
  #   cron: "*/30 * * * *"   # optional: every 30 minutes
  workflow_dispatch:
    inputs:
      force_images:
        description: "Re-encode every image, ignoring the cache"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Full history, required by `showLastUpdateTime`. The default depth
          # of 1 leaves `git log <file>` empty for every article the tip commit
          # did not touch, so Docusaurus would emit no `dateModified` at all —
          # silently, and only in production, since a local clone has the whole
          # history.
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Fetch API data (Lorem Picsum)
        run: |
          mkdir -p static/json
          echo "🌐 Calling Lorem Picsum API..."
          curl -o static/json/photos-data.json "https://picsum.photos/v2/list?page=4&limit=10"
          echo "✅ Data fetched and saved to static/json/photos-data.json"
          echo "📊 Preview:"
          head -n 20 static/json/photos-data.json

      # Persist already-optimized images between runs so only new/changed
      # images are re-encoded (see plugins/docusaurus-plugin-image-optimizer).
      - name: Cache optimized images
        uses: actions/cache@v4
        with:
          path: node_modules/.cache/docusaurus-plugin-image-optimizer
          # Keyed on what the cache actually depends on: the source images and
          # the encoding code. When neither changed the key hits exactly and
          # nothing is re-saved; when one did, restore-keys still seeds from the
          # previous cache so only the new work is done.
          key: image-optimizer-${{ hashFiles('static/**', 'src/**/*.png', 'src/**/*.jpg', 'src/**/*.jpeg', 'src/**/*.webp', 'plugins/docusaurus-plugin-image-optimizer/index.cjs') }}
          restore-keys: |
            image-optimizer-

      - name: Build Docusaurus site
        run: npm run build
        env:
          # Empty on a push, so the cache is used as usual. Set to 1 by the
          # "Run workflow" button when the box is ticked, which makes the
          # optimizer ignore the cache for that run and re-encode everything.
          # Use it to check the cache is not replaying stale bytes; use
          # CACHE_VERSION instead when the encoding itself changed, since that
          # has to invalidate for everyone and not just once.
          IMAGE_OPTIMIZER_FORCE: ${{ inputs.force_images && '1' || '' }}

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build
          publish_branch: gh-pages
          force_orphan: true
